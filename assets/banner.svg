<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Animated glowing filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1); opacity: 0.35; }
        50% { transform: scale(1.15); opacity: 0.6; }
      }
      @keyframes floatShield {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .animated-orb1 {
        animation: pulseOrb 6s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .animated-orb2 {
        animation: pulseOrb 8s ease-in-out infinite reverse;
        transform-origin: 1050px 300px;
      }
      .animated-shield {
        animation: floatShield 4s ease-in-out infinite;
      }
      .flowing-line {
        stroke-dasharray: 8 6;
        animation: dashFlow 8s linear infinite;
      }
      .radar-arm {
        transform-origin: 1060px 140px;
        animation: radarSweep 10s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Ambient Orbs (Strictly in Background) -->
  <circle class="animated-orb1" cx="200" cy="100" r="160" fill="#00f2fe" opacity="0.3" filter="url(#softGlow)" />
  <circle class="animated-orb2" cx="1020" cy="280" r="180" fill="#7928ca" opacity="0.3" filter="url(#softGlow)" />
  <circle cx="600" cy="380" r="140" fill="#ff0080" opacity="0.15" filter="url(#softGlow)" />

  <!-- Animated Cyber Circuits / Connecting Network Paths (Background) -->
  <path class="flowing-line" d="M 50 350 L 300 350 L 380 290 L 800 290 L 860 350 L 1150 350" fill="none" stroke="#00f2fe" stroke-opacity="0.35" stroke-width="2" />
  <path class="flowing-line" d="M 100 80 L 260 80 L 320 140 L 750 140" fill="none" stroke="#ff0080" stroke-opacity="0.3" stroke-width="2" style="animation-direction: reverse;" />

  <!-- Decorative Radar / Scanner Element on the top right (Background) -->
  <g opacity="0.45">
    <circle cx="1060" cy="140" r="70" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="1060" cy="140" r="45" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />
    <circle cx="1060" cy="140" r="20" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.5" />
    <line class="radar-arm" x1="1060" y1="140" x2="1130" y2="140" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- FOREGROUND: Main Content Container (Title, Tagline, Feature Pills) -->
  <g transform="translate(80, 0)">
    
    <!-- Top Pill: Category Identifier -->
    <g transform="translate(0, 52)">
      <rect width="250" height="32" rx="16" fill="rgba(0, 242, 254, 0.12)" stroke="#00f2fe" stroke-width="1.2" />
      <circle cx="16" cy="16" r="5" fill="#00f2fe" filter="url(#glowCyan)" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#00f2fe" letter-spacing="1">ZERO TRUST ARCHITECTURE</text>
    </g>

    <!-- Foreground Main Title with crisp drop-shadow -->
    <g transform="translate(0, 138)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5">
        <tspan fill="#ffffff">Enterprise Browser </tspan>
        <tspan fill="url(#cyberCyan)" filter="url(#glowCyan)">Security</tspan>
      </text>
    </g>

    <!-- Subtitle / Value Proposition in Foreground -->
    <g transform="translate(0, 185)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
        <tspan x="0" dy="0">Curated landscape of Enterprise Browsers, Remote Browser Isolation (RBI),</tspan>
        <tspan x="0" dy="26">In-Session Zero Trust, GenAI Data Loss Prevention &amp; Open-Source Tooling.</tspan>
      </text>
    </g>

    <!-- Interactive / Feature Badges (Pills) in Foreground -->
    <g transform="translate(0, 268)">
      <!-- Pill 1: In-Session DLP -->
      <g transform="translate(0, 0)">
        <rect width="175" height="38" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
        <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🛡️ In-Session DLP</text>
      </g>

      <!-- Pill 2: Browser Isolation -->
      <g transform="translate(190, 0)">
        <rect width="195" height="38" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
        <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🌐 Remote Isolation</text>
      </g>

      <!-- Pill 3: GenAI Guardrails -->
      <g transform="translate(400, 0)">
        <rect width="190" height="38" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
        <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🤖 GenAI Guardrails</text>
      </g>

      <!-- Pill 4: Open Source -->
      <g transform="translate(605, 0)">
        <rect width="175" height="38" rx="10" fill="url(#cardGrad)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.2" />
        <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38bdf8">⚡ Self-Hosted OSS</text>
      </g>
    </g>

    <!-- Bottom Status Bar -->
    <g transform="translate(0, 348)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">
        <tspan fill="#10b981">● ACTIVE TRACKING</tspan> — Commercial SASE Consolidators &amp; Self-Hosted Hardened Engines
      </text>
    </g>
  </g>

  <!-- Foreground Floating Shield Emblem (Right Side) -->
  <g class="animated-shield" transform="translate(940, 175)">
    <!-- Shield Outline -->
    <path d="M 70 0 C 110 0, 140 25, 140 70 C 140 135, 70 185, 70 185 C 70 185, 0 135, 0 70 C 0 25, 30 0, 70 0 Z" fill="url(#cardGrad)" stroke="#00f2fe" stroke-width="3" filter="url(#glowCyan)" />
    <!-- Browser Window Icon Inside Shield -->
    <rect x="28" y="42" width="84" height="64" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
    <line x1="28" y1="58" x2="112" y2="58" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="38" cy="50" r="3" fill="#ef4444" />
    <circle cx="48" cy="50" r="3" fill="#f59e0b" />
    <circle cx="58" cy="50" r="3" fill="#10b981" />
    <!-- Keyhole / Security Padlock symbol -->
    <path d="M 64 82 L 76 82 L 76 96 L 64 96 Z" fill="#00f2fe" />
    <circle cx="70" cy="78" r="6" fill="none" stroke="#00f2fe" stroke-width="2.5" />
  </g>
</svg>
